[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-agent-security"
version = "1.0.0"
description = "Reference implementation and conformance benchmark for security-context continuity in LLM agent control pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Chris Zheng", email = "chris@zast.ai"},
  {name = "Geng Yang", email = "geng@zast.ai"}
]
dependencies = [
  "cryptography>=42",
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
